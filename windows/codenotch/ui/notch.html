<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  #root{position:relative;width:100%;height:100%}

  /* The pill on the right edge */
  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:70px;padding:18px 0;background:#000;
    border-radius:20px 0 0 20px;
    /* Stays visible on dark wallpapers: a thin stroke plus a faint glow, the only outline when black sits on black */
    border:1px solid #2e2e2e;border-right:none;
    box-shadow:none;
    display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  }
  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. A 1 px
     ring in the stroke colour joins the pill's own stroke (the outline cue on black wallpapers). */
  #pill::before,#pill::after{
    content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none;
  }
  #pill{--fillet:26px}
  /* Hover-only mode: the pill parks just past the right edge and slides in when the cursor reaches
     the edge strip (its fillets ride along, they are children). Rust keeps an invisible 8 px strip
     hot while it is parked, so the window is not click-through there and the page sees the arrival. */
  #pill{transition:transform .18s ease,opacity .18s ease}
  #pill.parked{transform:translate(calc(100% + 2px),-50%);opacity:0}
  #pill::before{
    top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  #pill::after{
    bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ringwrap{position:relative;width:56px;height:56px}
  .ringwrap > svg.ring{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#e8e8ea;letter-spacing:-.5px;
  }
  .glyph.small{font-size:15px}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:26px;height:26px;color:#e8e8ea}
  .glyph .mark svg{width:26px;height:26px;fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:26px;height:26px;object-fit:contain}
  .glyph img.appicon{width:30px;height:30px;border-radius:8px;object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:#e8e8ea;margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:15px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
  .dim{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* A 60 fps SVG transform animation in a transparent always-on-top window slows the whole desktop
     compositor (other apps stutter). steps() drops repaints to ~10 fps; it still reads as spinning/breathing. */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}

  /* Hover card, shown to the left of the pill */
  #card{
    position:absolute;left:10px;right:80px;top:50%;transform:translateY(-50%);--tail:50%;
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed).
       The 246 cap matches the upstream spec. */
    max-width:246px;margin-left:auto;background:#0a0a0a;border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow:hidden; /* never taller than the window, however short it is */
    display:none;
  }
  #card.show{display:block}
  #card::after{ /* solid triangle pointing at the pill */
    content:"";position:absolute;right:-8px;top:var(--tail);transform:translateY(-50%);
    border:8px solid transparent;border-right:none;border-left:10px solid #0a0a0a;
  }
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:#808080;margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:#e8e8ea;font-weight:600;white-space:nowrap}
  .w-reset{color:#808080;font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:#2d2d2d;margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:#808080}
  .c-note{font-size:12px;color:#c8c8c8;line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid #1e1e1e;padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#b0b0b3;padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .c-src{font-size:10px;color:#707070;margin-top:10px}
  #notice{
    position:absolute;left:8px;bottom:6px;right:80px;font-size:10px;color:#808080;
    background:rgba(0,0,0,.85);border-radius:8px;padding:4px 8px;display:none
  }
  #notice.show{display:block}
  /* Sticky alert (W-20): shown in the pill's column so it is visible even while the card is closed */
  #alert{
    position:absolute;right:4px;top:6px;width:200px;font-size:11px;line-height:1.35;color:#1a1a1a;
    background:#FFBF00;border-radius:8px;padding:6px 8px;display:none;pointer-events:none
  }
  #alert.show{display:block}
</style>
</head>
<body>
<div id="root">
  <div id="card"></div>
  <div id="pill"></div><!-- one .cell per provider, stacked vertically (upstream: data-driven, the same layout for 1–5 cells) -->
  <div id="notice"></div>
  <div id="alert"></div>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

/* Colour ramp (upstream palette values) */
const AMPLE='#00FF88', WATCH='#F2FF00', CRIT='#FF3F00';
const TRACK='#303030', AMBER='#FFBF00', RUNGREEN='#28E07B';
const tone=f=> f>=0.8?CRIT : f>=0.5?WATCH : AMPLE;

// The provider list comes from Rust (providers.rs): [{id,name,glyph,capabilities,usage}] in pill order
let provs=[{id:'claude',name:'Claude',glyph:'C',capabilities:{usage:true},usage:{status:'',windows:[],fetched_at:0,note:''}}];
let glyphs={}; // id → {kind:'mark'|'appicon', url}
let activity=[]; // working state of the non-Claude providers: {provider,state:'busy'|'waiting',name,detail,since}
// "Is it working?" per provider: Claude from the four-state engine, the others from the activity probe. Returns running | attention | idle
function workState(id){
  if(id==='claude'){
    if(stateSnap.agg==='running') return 'running';
    if(stateSnap.agg==='attention') return 'attention';
    // The engine cannot see cloud sessions: fall back to the desktop app's network activity
    if(activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';
  return 'idle';
}
function glyphHtml(p,small){
  const g=glyphs[p.id];
  if(g&&g.kind==='svg'&&g.svg) return `<span class="mark">${g.svg}</span>`;
  if(g&&g.url) return `<img class="${g.kind}" src="${g.url}" alt="${esc(p.name)}"${small?' style="width:16px;height:16px;border-radius:4px"':''}>`;
  return small?'':esc(p.glyph); // fallback letter
}
// Cells top to bottom. `glyph` is the fallback letter used when no mark is available. Which providers
// appear (installed ones, plus any tool that only pushes activity) is decided in Rust.
function providers(){
  return provs.map(p=>({...p,snap:p.usage}));
}
function headlineOf(snap){
  // An expired window (its reset passed after the reading) says nothing about usage now
  const cur=snap.windows.filter(w=>!w.expired);
  if(!cur.length) return null;
  const metered=cur.filter(w=>w.count==null);
  if(metered.length) return metered.reduce((a,b)=> b.used>a.used?b:a);
  return cur[0];
}
/* ===== Page strings (W-13). The language is the one Rust resolved (state.lang_resolved), the same
   one the tray uses; WebView2's navigator.language is unreliable. {x} placeholders are filled by t(). */
const STR={
  en:{usageOf:'{name} Usage',signIn:'Sign in to {who} to see usage.',waiting:'Waiting for first reading…',
    reset:'Reset',windowReset:'Window reset — waiting for a new reading',used:'{p}% used',
    resetting:'Resetting…',resetsIn:'Resets in {m} min',resetsAt:'Resets at {t}',resetsOn:'Resets {d} {t}',
    updated:'Updated {a}',offline:'Offline — showing the reading from {a}',offlineNone:'Offline — no reading yet',couldNot:'Could not refresh',
    justNow:'just now',mAgo:'{n}m ago',hAgo:'{n}h ago',dAgo:'{n}d ago',
    tokens:'~{n} tokens',left:'{n} left',reqs:'{n} requests',req1:'1 request',reqToday:'~{n} requests today',req1Today:'~1 request today',noReqToday:'no requests today',
    actHooks:'Activity: live from Claude Code hooks',actEvent:'Activity: live, reported by the tool',
    actClaudeEst:'Activity: estimated — install Claude Code hooks from the tray for exact state',actEst:'Activity: estimated from local files, may lag',actNone:'Activity: not supported for this tool'},
  ar:{usageOf:'استخدام {name}',signIn:'سجّل الدخول إلى {who} لرؤية الاستخدام.',waiting:'في انتظار أول قراءة…',
    reset:'أُعيد الضبط',windowReset:'أُعيد ضبط الفترة — في انتظار قراءة جديدة',used:'مُستخدم {p}%',
    resetting:'يُعاد الضبط…',resetsIn:'يُعاد الضبط بعد {m} دقيقة',resetsAt:'يُعاد الضبط الساعة {t}',resetsOn:'يُعاد الضبط {d} {t}',
    updated:'آخر تحديث {a}',offline:'غير متصل — تُعرض قراءة {a}',offlineNone:'غير متصل — لا توجد قراءة بعد',couldNot:'تعذّر التحديث',
    justNow:'الآن',mAgo:'قبل {n} د',hAgo:'قبل {n} س',dAgo:'قبل {n} يوم',
    tokens:'~{n} رمز',left:'متبقٍ {n}',reqs:'{n} طلب',req1:'طلب واحد',reqToday:'~{n} طلب اليوم',req1Today:'~طلب واحد اليوم',noReqToday:'لا طلبات اليوم',
    actHooks:'النشاط: مباشر من روابط Claude Code',actEvent:'النشاط: مباشر، تُبلغ عنه الأداة',
    actClaudeEst:'النشاط: تقديري — ثبّت روابط Claude Code من الدرج لحالة دقيقة',actEst:'النشاط: تقديري من الملفات المحلية، وقد يتأخر',actNone:'النشاط: غير مدعوم لهذه الأداة'},
  zh:{usageOf:'{name} 用量',signIn:'登录 {who} 后即可查看用量。',waiting:'正在等待首次读取…',
    reset:'已重置',windowReset:'窗口已重置 — 等待新的读数',used:'已用 {p}%',
    resetting:'正在重置…',resetsIn:'{m} 分钟后重置',resetsAt:'{t} 重置',resetsOn:'{d} {t} 重置',
    updated:'更新于 {a}',offline:'离线 — 显示 {a} 的读数',offlineNone:'离线 — 暂无读数',couldNot:'无法刷新',
    justNow:'刚刚',mAgo:'{n} 分钟前',hAgo:'{n} 小时前',dAgo:'{n} 天前',
    tokens:'约 {n} tokens',left:'剩余 {n}',reqs:'{n} 次请求',req1:'1 次请求',reqToday:'今日约 {n} 次请求',req1Today:'今日约 1 次请求',noReqToday:'今日无请求',
    actHooks:'活动：来自 Claude Code 钩子的实时状态',actEvent:'活动：由工具实时上报',
    actClaudeEst:'活动：估算 — 从托盘安装 Claude Code 钩子可获得准确状态',actEst:'活动：根据本地文件估算，可能有延迟',actNone:'活动：此工具不支持'},
  ja:{usageOf:'{name} 使用量',signIn:'使用量を見るには {who} にサインインしてください。',waiting:'最初の読み取りを待っています…',
    reset:'リセット済み',windowReset:'ウィンドウがリセットされました — 新しい値を待っています',used:'{p}% 使用',
    resetting:'リセット中…',resetsIn:'{m} 分後にリセット',resetsAt:'{t} にリセット',resetsOn:'{d} {t} にリセット',
    updated:'{a}に更新',offline:'オフライン — {a}の値を表示中',offlineNone:'オフライン — まだ値がありません',couldNot:'更新できませんでした',
    justNow:'たった今',mAgo:'{n} 分前',hAgo:'{n} 時間前',dAgo:'{n} 日前',
    tokens:'約 {n} トークン',left:'残り {n}',reqs:'{n} リクエスト',req1:'1 リクエスト',reqToday:'今日 約 {n} リクエスト',req1Today:'今日 約 1 リクエスト',noReqToday:'今日のリクエストなし',
    actHooks:'アクティビティ：Claude Code フックからのリアルタイム',actEvent:'アクティビティ：ツールからのリアルタイム報告',
    actClaudeEst:'アクティビティ：推定 — 正確な状態にはトレイから Claude Code フックを導入',actEst:'アクティビティ：ローカルファイルから推定（遅れることがあります）',actNone:'アクティビティ：このツールは非対応'},
  ko:{usageOf:'{name} 사용량',signIn:'사용량을 보려면 {who}에 로그인하세요.',waiting:'첫 번째 값을 기다리는 중…',
    reset:'초기화됨',windowReset:'기간이 초기화됨 — 새 값을 기다리는 중',used:'{p}% 사용',
    resetting:'초기화 중…',resetsIn:'{m}분 후 초기화',resetsAt:'{t}에 초기화',resetsOn:'{d} {t}에 초기화',
    updated:'{a} 업데이트',offline:'오프라인 — {a} 값을 표시 중',offlineNone:'오프라인 — 아직 값 없음',couldNot:'새로 고칠 수 없음',
    justNow:'방금',mAgo:'{n}분 전',hAgo:'{n}시간 전',dAgo:'{n}일 전',
    tokens:'약 {n} 토큰',left:'{n}개 남음',reqs:'요청 {n}회',req1:'요청 1회',reqToday:'오늘 약 {n}회 요청',req1Today:'오늘 약 1회 요청',noReqToday:'오늘 요청 없음',
    actHooks:'활동: Claude Code 후크의 실시간 상태',actEvent:'활동: 도구가 실시간 보고',
    actClaudeEst:'활동: 추정 — 정확한 상태는 트레이에서 Claude Code 후크 설치',actEst:'활동: 로컬 파일 기반 추정(지연될 수 있음)',actNone:'활동: 이 도구는 지원하지 않음'},
};
/* Window labels come from the providers in English; the common ones are translated here */
const LABELS={
  ar:{'Current session':'الجلسة الحالية','Weekly (all models)':'أسبوعي (كل النماذج)','Weekly (Opus)':'أسبوعي (Opus)','Weekly':'أسبوعي','Weekly limit':'الحد الأسبوعي','Monthly limit':'الحد الشهري','5h limit':'حد 5 ساعات','Tokens this month':'الرموز هذا الشهر','Tokens today':'الرموز اليوم','Included usage':'الاستخدام المشمول','On demand':'عند الطلب','Premium requests':'الطلبات المميزة','Pro searches':'عمليات بحث Pro'},
  zh:{'Current session':'当前会话','Weekly (all models)':'每周（所有模型）','Weekly (Opus)':'每周（Opus）','Weekly':'每周','Weekly limit':'每周限额','Monthly limit':'每月限额','5h limit':'5 小时限额','Tokens this month':'本月 tokens','Tokens today':'今日 tokens','Included usage':'套餐内用量','On demand':'按需用量','Premium requests':'高级请求','Pro searches':'Pro 搜索'},
  ja:{'Current session':'現在のセッション','Weekly (all models)':'週間（全モデル）','Weekly (Opus)':'週間（Opus）','Weekly':'週間','Weekly limit':'週間上限','Monthly limit':'月間上限','5h limit':'5 時間上限','Tokens this month':'今月のトークン','Tokens today':'今日のトークン','Included usage':'プラン内使用量','On demand':'従量課金','Premium requests':'プレミアムリクエスト','Pro searches':'Pro 検索'},
  ko:{'Current session':'현재 세션','Weekly (all models)':'주간(모든 모델)','Weekly (Opus)':'주간(Opus)','Weekly':'주간','Weekly limit':'주간 한도','Monthly limit':'월간 한도','5h limit':'5시간 한도','Tokens this month':'이번 달 토큰','Tokens today':'오늘 토큰','Included usage':'포함 사용량','On demand':'온디맨드','Premium requests':'프리미엄 요청','Pro searches':'Pro 검색'},
};
const LOCALE={ar:'ar',en:'en-US',zh:'zh-CN',ja:'ja-JP',ko:'ko-KR'};
function lang(){ const l=stateSnap&&stateSnap.lang_resolved; return STR[l]?l:'en'; }
function t(key,vars){ let s=(STR[lang()][key]??STR.en[key]??key); for(const k in (vars||{})) s=s.split('{'+k+'}').join(vars[k]); return s; }
function label(s){ return (LABELS[lang()]||{})[s]||s; }
// W-12: Rust decides freshness per provider (live / stale / offline / error / needs_auth / no_data)
function dimmed(p){ return p.freshness==='stale'||p.freshness==='offline'||p.freshness==='error'; }
function freshnessLine(p){
  const a=p.age_ms?ago(p.age_ms):'';
  if(p.freshness==='stale'&&a) return t('updated',{a});
  if(p.freshness==='offline') return a?t('offline',{a}):t('offlineNone');
  if(p.freshness==='error') return t('couldNot');
  return '';
}
let stateSnap={sessions:[],agg:'idle'};

function svgArc(r,frac,color,width,extra=''){
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="butt"
    transform="rotate(-90 28 28)" ${extra}/>`;
}

function renderRing(){
  const ps=providers();
  // Rebuild the DOM only when the structure changes (never swap the element under the cursor)
  const want=ps.map(p=>p.id+':'+(glyphs[p.id]?glyphs[p.id].kind:'-')).join(',');
  if(pill.dataset.cells!==want){
    pill.innerHTML=ps.map(p=>`<div class="cell" data-p="${esc(p.id)}">
      <div class="ringwrap"><svg class="ring" viewBox="0 0 56 56"></svg><div class="glyph ${(!glyphs[p.id]&&p.glyph.length>1)?'small':''}">${glyphHtml(p)}</div></div>
      <div class="pct">—</div></div>`).join('');
    pill.dataset.cells=want;
  }
  for(const p of ps){
    const cell=pill.querySelector(`.cell[data-p="${p.id}"]`); if(!cell) continue;
    const svg=cell.querySelector('svg.ring'), pct=cell.querySelector('.pct'), glyph=cell.querySelector('.glyph'), wrap=cell.querySelector('.ringwrap');
    const h=headlineOf(p.snap);
    let inner=`<circle cx="28" cy="28" r="22" fill="#2a2a2a"/><circle cx="28" cy="28" r="25" fill="none" stroke="${TRACK}" stroke-width="5"/>`;
    if(h && h.count==null) inner+=svgArc(25,Math.min(h.used,1),tone(h.used),5);
    { // thin inner arc: spinning = working, amber pulse = waiting on you (one animation for all four, different sources)
      const ws=workState(p.id);
      if(ws==='running') inner+=`<g class="arc-spin">${svgArc(19,0.28,RUNGREEN,2.5)}</g>`;
      else if(ws==='attention') inner+=`<g class="arc-pulse"><circle cx="28" cy="28" r="19" fill="none" stroke="${AMBER}" stroke-width="2.5"/></g>`;
    }
    svg.innerHTML=inner;
    if(p.snap.status==='needsAuth'||p.snap.status==='none'||(!h&&p.snap.windows.length)||(p.capabilities&&!p.capabilities.usage)) pct.textContent='—';
    else if(h && h.count!=null) pct.textContent=(h.derived?'~':'')+compact(h.count); // exact counts (Perplexity, Copilot) carry no ~
    else if(h) pct.textContent=(h.derived?'~':'')+Math.round(h.used*100)+'%';
    else pct.textContent='…';
    glyph.classList.toggle('dim', !!(h && h.used>=1));
    wrap.classList.toggle('dim', dimmed(p));
  }
  reportHot(); // a provider appearing or leaving resizes the pill
}

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return t('resetting');
  if(diff<60*60*1000) return t('resetsIn',{m:Math.max(1,Math.round(diff/60000))});
  const d=new Date(ms), loc=LOCALE[lang()];
  const tm=d.toLocaleTimeString(loc,{hour:'numeric',minute:'2-digit'});
  if(diff<24*60*60*1000) return t('resetsAt',{t:tm});
  return t('resetsOn',{d:d.toLocaleDateString(loc,{weekday:'short'}),t:tm});
}

function compact(n){ return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n); }
function countCopy(w){
  if(w.unit==='tokens') return t('tokens',{n:compact(w.count)});
  if(w.unit==='left') return t('left',{n:compact(w.count)});
  if(w.unit==='requests') return w.count===1?t('req1'):t('reqs',{n:compact(w.count)});
  return w.count>1?t('reqToday',{n:w.count}):w.count===1?t('req1Today'):t('noReqToday');
}
function ago(ageMs){ // age in ms → "5m ago"
  const m=Math.round(ageMs/60000);
  if(m<1) return t('justNow');
  if(m<60) return t('mAgo',{n:m});
  const h=Math.round(m/60);
  return h<48?t('hAgo',{n:h}):t('dAgo',{n:Math.round(h/24)});
}

// W-08: say where the working/waiting state comes from, so "idle" is never mistaken for "can't tell"
function activitySource(p){
  const a=p.capabilities&&p.capabilities.activity;
  if(a==='event') return p.id==='claude'?t('actHooks'):t('actEvent');
  if(a==='inferred') return p.id==='claude'?t('actClaudeEst'):t('actEst');
  return t('actNone');
}
const STATE_DOT={running:RUNGREEN,attention:AMBER,done:'#57c7ff'};

let hoverId='claude';
function renderCard(){
  const c=document.getElementById('card');
  const p=providers().find(x=>x.id===hoverId)||providers()[0];
  const snap=p.snap;
  const headIcon=glyphHtml(p,true);
  const noQuota=p.capabilities&&!p.capabilities.usage;
  let html=`<div class="c-head">${headIcon}<span class="c-title">${esc(noQuota?p.name:t('usageOf',{name:p.name}))}</span></div>`;
  const fl=freshnessLine(p);
  if(fl) html+=`<div class="c-sub">${esc(fl)}</div>`;
  if(snap.status==='needsAuth'){
    const who=p.id==='claude'?'Claude Code':p.name;
    html+=`<div class="c-note">${esc(t('signIn',{who}))}<br>${esc(snap.note)}</div>`;
  }else if(!snap.windows.length){
    html+=`<div class="c-note">${esc(snap.note||t('waiting'))}</div>`;
  }else{
    for(const w of snap.windows){
      if(w.count!=null){
        html+=`<div class="win"><div class="w-row"><span class="w-label">${esc(label(w.label))}</span></div>
          <div class="w-used">${esc(countCopy(w))}</div></div>`;
        continue;
      }
      if(w.expired){
        html+=`<div class="win"><div class="w-row"><span class="w-label">${esc(label(w.label))}</span><span class="w-reset">${esc(t('reset'))}</span></div>
          <div class="w-track"></div><div class="w-used">${esc(t('windowReset'))}</div></div>`;
        continue;
      }
      html+=`<div class="win">
        <div class="w-row"><span class="w-label">${esc(label(w.label))}</span><span class="w-reset">${esc(resetCopy(w.resets_at))}</span></div>
        <div class="w-track"><div class="w-fill" style="width:${(Math.min(w.used,1)*100).toFixed(0)}%;background:${tone(w.used)}"></div></div>
        <div class="w-used">${w.derived?'~':''}${esc(t('used',{p:Math.round(w.used*100)}))}</div>
      </div>`;
    }
    if(snap.note) html+=`<div class="c-note">${esc(snap.note)}</div>`;
  }
  if(p.id==='claude'){ // live sessions (a full list with jump-to-session is a follow-up)
    const act=stateSnap.sessions.filter(s=>s.state!=='idle');
    if(act.length){
      html+=`<div class="c-sessions">`;
      for(const s of act.slice(0,5)){
        html+=`<div class="s-row"><span class="s-dot" style="background:${STATE_DOT[s.state]||'#666'}"></span>${esc(s.title)}</div>`;
      }
      html+=`</div>`;
    }
  }else{ // other providers: detected activity rows (Cursor reports state; Codex/Antigravity are inferred from recent writes)
    const acts=activity.filter(a=>a.provider===p.id);
    if(acts.length){
      html+=`<div class="c-sessions">`;
      for(const a of acts.slice(0,5)){
        const col=a.state==='waiting'?AMBER:RUNGREEN;
        html+=`<div class="s-row"><span class="s-dot" style="background:${col}"></span>${esc(a.name)}<span style="color:#808080;margin-left:auto">${esc(a.detail)}</span></div>`;
      }
      html+=`</div>`;
    }
  }
  html+=`<div class="c-src">${esc(activitySource(p))}</div>`;
  c.innerHTML=html;
  c.dir=lang()==='ar'?'rtl':'ltr'; // Arabic reads right to left; the card stays where it is
  placeCard();
}
// The card follows the hovered cell: vertically centred on it (kept inside the window), tail pointing at it
function placeCard(){
  const cell=pill.querySelector(`.cell[data-p="${hoverId}"]`)||pill;
  const cr=cell.getBoundingClientRect();
  const cy=cr.top+cr.height/2;
  const H=innerHeight, ch=card.offsetHeight||0;
  let top=Math.round(cy-ch/2); top=Math.max(8,Math.min(top,H-ch-8));
  card.style.top=top+'px'; card.style.transform='none';
  card.style.setProperty('--tail',Math.max(16,Math.min(ch-16,Math.round(cy-top)))+'px');
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* Hover: stays expanded while either the pill or the card is under the cursor; collapses after a 250 ms grace period (upstream motion rule) */
const card=document.getElementById('card'), pill=document.getElementById('pill');
let hideTimer=null;
/* Hover-only (config hover_only, tray toggle): the pill is parked off-screen until the cursor reaches the
   edge strip; leaving the pill/card parks it again through the same collapse path as the card. */
let hoverOnly=false;
const EDGE_PX=8;
function parked(){return hoverOnly&&pill.classList.contains('parked');}
function zoomK(){return parseFloat(document.documentElement.style.zoom)||1;}
// The pill's layout box ignoring its transform (parking animates the transform, so the live bounding
// rect is mid-flight for 180 ms) in client space: top:50% + translateY(-50%) means offsetTop is the centre.
function pillHome(){
  const z=zoomK(), w=pill.offsetWidth, h=pill.offsetHeight;
  const top=(pill.offsetTop-h/2)*z, right=(pill.offsetLeft+w)*z;
  return {left:right-w*z,right,top,bottom:top+h*z};
}
function edgeRect(){const h=pillHome();return {left:h.right-EDGE_PX,right:h.right,top:h.top,bottom:h.bottom};}
function wakePill(){ if(!hoverOnly||!pill.classList.contains('parked'))return; pill.classList.remove('parked'); reportHot(); }
function applyPrefs(p){
  hoverOnly=!!(p&&p.hover_only);
  pill.classList.toggle('parked',hoverOnly&&!card.classList.contains('show'));
  reportHot();
}
function showCard(){clearTimeout(hideTimer);card.classList.add('show');renderCard();armWatchdog();} // show first, then render: placeCard needs offsetHeight
function hideCard(){
  card.classList.remove('show');
  if(hoverOnly&&!dragging) pill.classList.add('parked'); // never park mid-drag: the pill is what is being dragged
  reportHot();
}
function scheduleHide(){clearTimeout(hideTimer);hideTimer=setTimeout(hideCard,250);}
// ===== Diagnostics + geometry =====
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function callq(cmd,args){ // invoke with visible failure: any command error is reported on screen (a silent .catch used to swallow them)
  return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;});
}
// Hot rectangles are reported in physical pixels (multiplied by this page's real DPR), so the Rust side does no conversion — WebView2's DPR and the window scale can disagree
function rectOf(el){const r=el.getBoundingClientRect(),k=window.devicePixelRatio||1;return [r.left*k,r.top*k,r.width*k,r.height*k];}
/* Rust gates click-through on these, so they are reported whenever the pill or card moves, not only
   when the card opens: a stale pill rectangle is a pill that cannot be clicked. */
function reportHot(){
  const open=card.classList.contains('show');
  const k=window.devicePixelRatio||1, phys=r=>[r.left*k,r.top*k,(r.right-r.left)*k,(r.bottom-r.top)*k];
  // Parked: only the edge strip is hot. Shown: the pill's home box (not its animating rect), plus the card.
  const rects=parked()?[phys(edgeRect())]:open?[phys(pillHome()),rectOf(card)]:[phys(pillHome())];
  // A visible pill counts as expanded in hover-only mode, so the Rust watchdog reports the cursor leaving it
  callq('set_hot',{rects,expanded:open||(hoverOnly&&!parked())}).catch(()=>{});
}
function armWatchdog(){
  requestAnimationFrame(reportHot); // wait one frame so renderCard's new content is laid out before measuring
}
// Viewport fit (pure front-end fallback, independent of Rust): the window is 340 × primary scale physical px,
// so if this page's CSS viewport is not 340 wide the WebView's DPR disagrees with the monitor; CSS zoom pulls the layout back to the design size.
function fitZoom(){
  const z=innerWidth/340;
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
}
reportDpr();
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr();reportHot();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',reportDpr);

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  for(const el of pill.querySelectorAll('.cell')){ if(inRect(x,y,el.getBoundingClientRect(),6)) return el.dataset.p; }
  return null;
}
function pointerInHot(x,y){
  if(parked()) return inRect(x,y,edgeRect(),4);
  const p=pillHome();
  if(inRect(x,y,p,4))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  if(dragging)return; // no card while dragging
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    if(parked()){ wakePill(); return; } // first contact at the edge slides the pill in; the cells go hot on the next move
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    if(!card.classList.contains('show')) showCard();
  }
  else if(card.classList.contains('show')||(hoverOnly&&!parked())){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget && card.classList.contains('show')){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); }
});
listen('pointer_left',()=>{clearTimeout(hideTimer);hideCard();}).catch(()=>{});
// Card content changes change its height -> report the hot rectangles again
listen('providers',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
/* The pill can be dragged up and down the right edge. Press and move more than 4 px = drag (handed to Rust,
   which follows the system cursor; the card is collapsed first); release without moving = click (opens the provider's usage page). */
let press=null, dragging=false;
pill.addEventListener('mousedown',e=>{ if(e.button!==0)return; press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId}; });
document.addEventListener('mousemove',e=>{
  if(!press||dragging)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; clearTimeout(hideTimer); hideCard();
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;});
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(press&&!dragging) invoke('open_provider_page',{provider:press.id}).catch(()=>{});
  press=null;
});
listen('drag_end',()=>{dragging=false;press=null;reportHot();}).catch(()=>{});

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

listen('providers',e=>{provs=e.payload||provs;renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(providers) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
listen('notice',e=>notice(e.payload)).catch(()=>{});
function showAlert(msg){ const a=document.getElementById('alert'); a.textContent=msg||''; a.classList.toggle('show',!!msg); }
listen('alert',e=>showAlert(e.payload)).catch(()=>{});
invoke('get_alert').then(showAlert).catch(()=>{});
listen('glyphs',e=>{glyphs=e.payload||glyphs;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('activity',e=>{activity=e.payload||activity;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_activity').then(a=>{activity=a||activity;renderRing();}).catch(()=>{});
invoke('get_glyphs').then(g=>{glyphs=g||glyphs;renderRing();}).catch(()=>{});
invoke('get_providers').then(l=>{provs=l||provs;renderRing();}).catch(e=>notice('get_providers failed: '+e));
invoke('get_state').then(s=>{stateSnap=s||stateSnap;renderRing();}).catch(()=>{});
invoke('get_prefs').then(applyPrefs).catch(()=>{});
listen('prefs',e=>applyPrefs(e.payload)).catch(()=>{});
setInterval(renderRing,30_000); // stale state and reset copy move with time
</script>
</body>
</html>
