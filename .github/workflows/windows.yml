name: Windows

# Test on every push/PR; build the installer on every push; attach it to a GitHub release on `win-v*` tags.
on:
  push:
    branches: [main, windows-live-status] # windows-live-status is this repo's default branch
    tags: ["win-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit # blocking; accepted warnings and their reasons are in windows/.cargo/audit.toml

      - name: Build hook binary
        run: cargo build --release --locked -p codenotch-hook

      - name: Stage hook as Tauri sidecar
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String "^host:").ToString().Split(" ")[1]
          Copy-Item target\release\codenotch-hook.exe "codenotch\binaries\codenotch-hook-$triple.exe" -Force

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installer
        working-directory: windows/codenotch
        run: cargo tauri build --config tauri.release.conf.json
        # Code signing: set WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD (or Azure Trusted Signing)
        # and add `bundle.windows.certificateThumbprint` / `signCommand` — see windows/RELEASE.md.
        if: ${{ !startsWith(github.ref, 'refs/tags/win-v') }}

      # Release tags are signed for auto-update (W-10). Without the secret this step fails, so an
      # unsigned build can never be published as an update.
      - name: Build signed installer (release)
        if: startsWith(github.ref, 'refs/tags/win-v')
        working-directory: windows/codenotch
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY secret is missing - see windows/RELEASE.md" }
          cargo tauri build --config tauri.release.conf.json --config tauri.updater.conf.json

      - name: Write updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/win-v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $version = "${{ github.ref_name }}".Substring(6)
          $name = $exe.Name.Replace(' ', '.')
          $manifest = [ordered]@{
            version = $version
            notes = "Codenotch for Windows $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name" } }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content target/release/bundle/nsis/latest.json -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: codenotch-windows-${{ github.sha }}
          path: |
            windows/target/release/bundle/nsis/*.exe
            windows/target/release/bundle/nsis/*.sig
            windows/target/release/bundle/nsis/latest.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/win-v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codenotch-windows-${{ github.sha }}
          path: dist
      - name: Add a fixed-name copy for the README download link
        run: cp dist/Codenotch_*_x64-setup.exe dist/Codenotch-Setup.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "Codenotch for Windows ${GITHUB_REF_NAME#win-v}" --generate-notes
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
