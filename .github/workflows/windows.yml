name: Windows

# Test on every push/PR; build the installer on every push; attach it to a GitHub release on `win-v*` tags.
on:
  push:
    branches: [main]
    tags: ["win-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
        continue-on-error: true # report-only until the current findings are triaged (see windows/TASKS.md)

      - name: Build hook binary
        run: cargo build --release --locked -p codenotch-hook

      - name: Stage hook as Tauri sidecar
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String "^host:").ToString().Split(" ")[1]
          Copy-Item target\release\codenotch-hook.exe "codenotch\binaries\codenotch-hook-$triple.exe" -Force

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installer
        working-directory: windows/codenotch
        run: cargo tauri build --config tauri.release.conf.json
        # Code signing: set WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD (or Azure Trusted Signing)
        # and add `bundle.windows.certificateThumbprint` / `signCommand` — see windows/RELEASE.md.

      - uses: actions/upload-artifact@v4
        with:
          name: codenotch-windows-${{ github.sha }}
          path: windows/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/win-v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codenotch-windows-${{ github.sha }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.exe --repo "${GITHUB_REPOSITORY}" --title "Codenotch for Windows ${GITHUB_REF_NAME#win-v}" --generate-notes
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
